name: Kitapligim reading counter sync
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update reading counters
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="    save();\n    if(autoFinished)showBookFinishedCelebration(obj.id); else renderBook(obj.id);"; new="    save();\n    setupReadingStreak();\n    if(autoFinished)showBookFinishedCelebration(obj.id); else renderBook(obj.id);"; assert s.count(old)==1 or new in s; p.write_text(s.replace(old,new))'
      - name: Commit when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh reading streak on book progress save"
          git push
