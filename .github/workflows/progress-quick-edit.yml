name: Kitapligim mobile layout polish
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve narrow screen layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='/* Kitapligim - modern reading calendar, scoped and non-destructive */'
          css="""/* Mobile readability and keyboard-safe form refinements; scoped to app views. */
          #libraryView .book,#bookDetailView .bookDetailHero,#miniView .miniHero{min-width:0}
          #libraryView .book>*,#bookDetailView .bookDetailHero>*,#miniView .miniHero>*{min-width:0}
          #libraryView .book h3,#libraryView .bookAuthor,#bookDetailView .bookDetailAuthor,#miniView .miniTitle,
          #bookDetailView .quote,#miniView .miniFlowText,#quoteFormView textarea,#bookFormView textarea,
          #bookDetailView .note{overflow-wrap:anywhere;word-break:normal}
          #bookFormView .row>div,#quoteFormView .grid>div{min-width:0}
          #bookFormView input,#bookFormView textarea,#bookFormView select,
          #quoteFormView input,#quoteFormView textarea,#quoteFormView select{max-width:100%;font-size:16px}
          #bookFormView .formActions button,#quoteFormView .formActions button{min-height:44px}
          #bookFormView input:focus,#bookFormView textarea:focus,#bookFormView select:focus,
          #quoteFormView input:focus,#quoteFormView textarea:focus,#quoteFormView select:focus{scroll-margin-bottom:160px}
          @media(max-width:420px){
           #bookFormView .row{align-items:flex-start;gap:10px}
           #bookFormView .coverPreview{width:76px;height:112px}
           #bookFormView .row #coverPreviewWrap{flex:0 0 76px}
           #bookFormView .formActions,#quoteFormView .formActions{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
           #bookFormView .formActions button,#quoteFormView .formActions button{width:100%;white-space:normal}
           #bookDetailView .quote{font-size:clamp(17px,5vw,22px)}
           #miniView .miniFlowText{font-size:clamp(17px,4.8vw,21px)}
          }
          @media(max-width:350px){
           #libraryView .book{grid-template-columns:70px minmax(0,1fr);gap:10px}
           #libraryView .book .cover{width:70px;height:105px}
           #bookDetailView .bookDetailHero{grid-template-columns:76px minmax(0,1fr);gap:10px}
           #bookDetailView .bookDetailCover{width:76px;height:112px}
           #bookDetailView .bookDetailTitle{font-size:23px}
          }
          """
          assert s.count(anchor)==1
          s=s.replace(anchor,css+'\n'+anchor)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve narrow mobile forms and long text wrapping"
          git push
