name: Fix iOS story long press
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable iOS selection in story overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=""" overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:#0e1727;display:flex;align-items:center;justify-content:center;padding:10px;color:white';"""
          new=""" overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:#0e1727;display:flex;align-items:center;justify-content:center;padding:10px;color:white;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation';"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old=""" const stage=overlay.firstElementChild;
           function stopTimer()"""
          new=""" const stage=overlay.firstElementChild;
           overlay.addEventListener('contextmenu',event=>event.preventDefault());
           overlay.addEventListener('selectstart',event=>event.preventDefault());
           overlay.addEventListener('dragstart',event=>event.preventDefault());
           function stopTimer()"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""  pressStart=Date.now();pressX=e.clientX;pressY=e.clientY;pressId=e.pointerId;
            pause();"""
          new="""  if(e.cancelable)e.preventDefault();
            pressStart=Date.now();pressX=e.clientX;pressY=e.clientY;pressId=e.pointerId;
            pause();"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/check.js').write_text(s.rsplit('<script>',1)[-1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Prevent iOS text selection during story hold"
          git push
