name: Diagnose journey error
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose journey error details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  catch(error){console.error('Okuma Yolculuğum açılış hatası:',error);alert('Okuma Yolculuğu açılamadı. Lütfen sayfayı yenileyip tekrar dene.')}"""
          new="""  catch(error){
             console.error('Okuma Yolculuğum açılış hatası:',error);
             const detail=error&&error.message?String(error.message):'Bilinmeyen hata';
             alert('Okuma Yolculuğu açılamadı. Hata ayrıntısı: '+detail);
            }"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show reading journey error detail"
          git push
