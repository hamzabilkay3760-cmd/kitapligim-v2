name: Kitapligim backup assurance
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add backup assurance indicator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="card"><h2 class="serif">Yedeğini al</h2><p class="muted">Kitaplar ve alıntılar cihazınızın tarayıcısında saklanır. Tarayıcı verileri silinirse kaybolabilir.</p><div class="actions">'
          new='<div class="card"><h2 class="serif">Yedeğini al</h2><p class="muted">Kitaplar ve alıntılar cihazınızın tarayıcısında saklanır. Tarayıcı verileri silinirse kaybolabilir.</p><div id="backupAssurance" style="background:#f8f5ed;border:1px solid #e6dccb;border-radius:13px;padding:13px 15px;margin:14px 0"><strong style="font-size:14px;color:#182640">Yedekleme güvencesi</strong><p id="backupAssuranceText" class="muted" style="font-size:12px;line-height:1.6;margin:7px 0 0"></p></div><div class="actions">'
          assert s.count(old)==1,'backup UI anchor missing'
          s=s.replace(old,new)
          old="const showBackupStatus=message=>{backupStatus.textContent=message};"
          new="""const showBackupStatus=message=>{backupStatus.textContent=message};
          const backupLastDownloadKey='kitapligim_backup_last_download';
          function refreshBackupAssurance(){
           const target=document.querySelector('#backupAssuranceText');if(!target)return;
           const stamp=localStorage.getItem(backupLastDownloadKey),date=stamp?new Date(stamp):null;
           if(!date||isNaN(date.getTime())){target.textContent='Bu cihazda henüz yedek indirme kaydı yok. Kitaplığını korumak için JSON yedeğini indirip güvenli bir yerde sakla.';return}
           const days=Math.max(0,Math.floor((Date.now()-date.getTime())/86400000));
           const formatted=date.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
           target.textContent='Son yedek indirme kaydı: '+formatted+'. '+(days>=30?'30 günden uzun süre geçmiş. Yeni bir yedek almanı öneririz.':days>=7?'Bir haftadan uzun süre geçmiş. Yeni kitaplar eklediysen yedeğini güncelle.':'Yedekleme kaydın güncel görünüyor.')+' Bu tarih yalnızca bu cihazda dosya indirme işleminin başlatıldığını gösterir; dosyanın güvenli yerde saklandığını doğrulamaz.';
          }
          refreshBackupAssurance();"""
          assert s.count(old)==1,'status anchor missing'
          s=s.replace(old,new)
          old="a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);"
          new="a.click();a.remove();localStorage.setItem(backupLastDownloadKey,new Date().toISOString());refreshBackupAssurance();setTimeout(()=>URL.revokeObjectURL(url),60000);"
          assert s.count(old)==1,'download anchor missing'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add local backup recency indicator"
          git push
