name: Smooth story progress bars
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Animate story progress bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""   bars[i].style.background='linear-gradient(to right,#d6b878 '+Math.round(fraction*100)+'%,#ffffff38 '+Math.round(fraction*100)+'%)';"""
          new="""   bars[i].style.background='#ffffff38';
             const fill=bars[i].firstElementChild;
             if(fill){fill.style.transition='none';fill.style.width=Math.round(fraction*100)+'%'}"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""  started=Date.now();
            timer=setTimeout"""
          new="""  started=Date.now();
            const fill=progress.children[index]&&progress.children[index].firstElementChild;
            if(fill){fill.getBoundingClientRect();fill.style.transition='width '+Math.max(1,duration-elapsed)+'ms linear';fill.style.width='100%'}
            timer=setTimeout"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""progress.innerHTML=slides.map(()=>'<span style="height:3px;flex:1;border-radius:8px;background:#ffffff38"></span>').join('');"""
          new="""progress.innerHTML=slides.map(()=>'<span style="height:3px;flex:1;border-radius:8px;background:#ffffff38;overflow:hidden"><span style="display:block;height:100%;width:0;background:#d6b878"></span></span>').join('');"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/check.js').write_text(s.rsplit('<script>',1)[-1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Animate story playback progress"
          git push
