name: Kitapligim safe save warning
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard library saves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const save=()=>localStorage.setItem(storeKey,JSON.stringify(state)); const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();"
          new="""// Preserve the last successfully saved library if browser storage is full or unavailable.
          let librarySaveFailureShown=false;
          const save=()=>{
           try{
            const serialized=JSON.stringify(state);
            localStorage.setItem(storeKey,serialized);
            librarySaveFailureShown=false;
            return true;
           }catch(error){
            console.error('Kitaplığım: kitaplık kaydedilemedi',error);
            if(!librarySaveFailureShown){
             librarySaveFailureShown=true;
             alert('Dikkat: Son değişiklik kaydedilemedi. Tarayıcı depolama alanı dolmuş veya kullanılamıyor olabilir. Uygulamayı kapatmadan önce Veriler bölümünden JSON yedeği almayı dene. Sorun çözülene kadar yeni kayıt ekleme.');
            }
            return false;
           }
          };
          const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();"""
          assert s.count(old)==1,'save anchor missing'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Warn on library save failures without erasing existing data"
          git push
