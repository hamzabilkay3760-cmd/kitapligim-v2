name: Kitapligim reading journal clarity
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify reading history and averages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""     const book=state.books.find(b=>String(b.id)===String(x.bookId));
               const pages=Number(x.pages)||0;
               return '<div class="readingHistoryRow" '"""
          new="""     const book=state.books.find(b=>String(b.id)===String(x.bookId));
               const pages=Number(x.pages)||0;
               const breakdown=x.bookPages&&typeof x.bookPages==='object'&&!Array.isArray(x.bookPages)&&Object.keys(x.bookPages).length?x.bookPages:(x.bookId?{[String(x.bookId)]:pages}:{});
               const names=Object.entries(breakdown).filter(([,n])=>Number(n)>0).map(([id,n])=>{
                 const found=state.books.find(b=>String(b.id)===String(id));
                 return esc(found?String(found.title||'İsimsiz kitap'):'Silinmiş kitap')+' · '+Number(n)+' sayfa';
               }).join('<span style="padding:0 4px;color:#a79c89">·</span>');
               return '<div class="readingHistoryRow" '"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""esc(book?String(book.title||''):'Kitap kaydı bulunamadı')+'</div></div>'+"""
          new="""(names||esc(book?String(book.title||''):'Kitap kaydı bulunamadı'))+'</div></div>'+"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""white-space:nowrap;overflow:hidden;text-overflow:ellipsis"""
          new="""overflow-wrap:anywhere;line-height:1.5"""
          assert s.count(old)>=1
          s=s.replace(old,new,1)
          old="""'<div class="eyebrow" style="font-size:9px">Günlük ort.</div>'"""
          new="""'<div class="eyebrow" style="font-size:9px">Okunan gün ort.</div>'"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""'<div style="display:flex;justify-content:space-between;gap:5px;margin-top:12px">'+weekStrip+'</div>'+"""
          new="""'<div class="muted" style="font-size:11px;line-height:1.45;margin-top:7px">Ortalama, yalnızca okuma yaptığın günlere göre hesaplanır.</div>'+
               '<div style="display:flex;justify-content:space-between;gap:5px;margin-top:12px">'+weekStrip+'</div>'+"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""'<div class="muted" style="font-size:12px">Günde ortalama '+dailyAverageText+' sayfa</div>'"""
          new="""'<div class="muted" style="font-size:12px">Takvim günü başına '+dailyAverageText+' sayfa</div>'"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""'<div class="muted" style="font-size:12px">Günde ortalama '+avgText(previousAverage)+' sayfa</div>'"""
          new="""'<div class="muted" style="font-size:12px">Takvim günü başına '+avgText(previousAverage)+' sayfa</div>'"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all books in reading history and clarify averages"
          git push
