name: Kitapligim data headings polish
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize data page headings only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Veriler: unified section heading typography and palette */'
          if marker not in s:
              assert s.count('</style>')>=1
              s=s.replace('</style>',"\n/* Veriler: unified section heading typography and palette */\n#dataView .title{font-family:Georgia,\"Times New Roman\",serif!important;color:#102238!important;font-weight:700!important;letter-spacing:-.035em!important}\n#dataView .card>h2,#dataView .card>.serif,#dataView #annualSummarySafe>h2,#dataView #readingJournalSafe h2,#dataView #monthlyReadingCalendar h2{font-family:Georgia,\"Times New Roman\",serif!important;color:#102238!important;font-weight:650!important;letter-spacing:-.035em!important;line-height:1.2!important}\n#dataView .eyebrow,#dataView #annualSummarySafe>.eyebrow,#dataView #readingJournalSafe>.eyebrow,#dataView #monthlyReadingCalendar>.eyebrow{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif!important;font-size:11px!important;font-weight:700!important;letter-spacing:.075em!important;color:#92703c!important}\n#dataView #annualSummarySafe>div[style*=\"grid-template-columns\"]>div div[style*=\"Georgia\"],#dataView #readingJournalSafe>div[style*=\"grid-template-columns\"]>div div[style*=\"Georgia\"]{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif!important;font-weight:700!important;font-size:27px!important;color:#102238!important}\n\n"+'</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit scoped style
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify data dashboard heading fonts and colors"
          git push
