name: Kitapligim daily reading sync
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/progress-quick-edit.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh reading counters after progress changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    save();
    if(autoFinished)showBookFinishedCelebration(obj.id); else renderBook(obj.id);"""
          new="""    save();
    // Synchronize daily streak, calendar and journal after every book progress save.
    setupReadingStreak();
    renderMonthlyReadingCalendarSafe();
    renderReadingJournalWeeklySafe();
    renderMonthlyReadingComparison();
    if(autoFinished)showBookFinishedCelebration(obj.id); else renderBook(obj.id);"""
          if old in s:
              assert s.count(old)==1
              s=s.replace(old,new)
          elif new not in s: raise SystemExit('Progress save anchor not found')
          old2="""     saveReadingStreakData(latest);save();
       readingCalendarSelectedDay=key;"""
          new2="""     saveReadingStreakData(latest);save();
       setupReadingStreak();
       readingCalendarSelectedDay=key;"""
          if old2 in s:
              assert s.count(old2)==1
              s=s.replace(old2,new2)
          elif new2 not in s: raise SystemExit('Calendar anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated fix
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Synchronize reading counters after progress edits"
          git push
