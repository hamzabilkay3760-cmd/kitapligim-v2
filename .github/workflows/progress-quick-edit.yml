name: Kitapligim compact memory quotes
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clamp memory quotes and link to full archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""${selected.length?selected.map(q=>'<div style="background:#f7f1e6;border-radius:13px;padding:12px;margin-bottom:9px;font-family:Georgia,serif;font-size:14px;line-height:1.6;color:#302f2b">'+esc(String(q.text||''))+'<div class="muted" style="font-family:system-ui;font-size:11px;margin-top:6px">Sayfa '+esc(String(q.page||'—'))+'</div></div>').join(''):'<p class="muted" style="font-size:13px">Bu kitap için henüz alıntı kaydedilmemiş.</p>'}"""
          new="""${selected.length?selected.map((q,i)=>'<div class="memoryRevisitQuote" data-quote-index="'+i+'" style="background:#f7f1e6;border-radius:13px;padding:12px;margin-bottom:9px;font-family:Georgia,serif;font-size:14px;line-height:1.6;color:#302f2b;cursor:pointer" role="button" tabindex="0" aria-label="Alıntının tamamını aç"><div class="memoryQuoteText" style="display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:pre-wrap">'+esc(String(q.text||''))+'</div><div class="muted" style="font-family:system-ui;font-size:11px;margin-top:6px">Sayfa '+esc(String(q.page||'—'))+' · Tamamını okumak için dokun</div></div>').join(''):'<p class="muted" style="font-size:13px">Bu kitap için henüz alıntı kaydedilmemiş.</p>'}
           ${quotes.length?'<button id="memoryRevisitAllQuotes" class="btn secondary" style="width:100%;margin-top:5px">Tüm alıntılarımı gör ('+quotes.length+')</button>':''}"""
          assert s.count(old)==1, 'quote block mismatch'
          s=s.replace(old,new)
          old="overlay.querySelector('#memoryRevisitClose').onclick=close;"
          new="""overlay.querySelector('#memoryRevisitClose').onclick=close;
           overlay.querySelectorAll('.memoryRevisitQuote').forEach(card=>{
            const expand=()=>{const txt=card.querySelector('.memoryQuoteText');if(!txt)return;const open=txt.style.webkitLineClamp==='unset';txt.style.webkitLineClamp=open?'3':'unset';card.querySelector('.muted').textContent='Sayfa '+String(selected[Number(card.dataset.quoteIndex)]?.page||'—')+(open?' · Tamamını okumak için dokun':' · Kısaltmak için dokun')};
            card.onclick=expand;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();expand()}};
           });
           const allQuotes=overlay.querySelector('#memoryRevisitAllQuotes');
           if(allQuotes)allQuotes.onclick=()=>{close();const target=document.querySelector('.bookDetailQuotesHead')||document.querySelector('#quotesList');if(target)target.scrollIntoView({behavior:'smooth',block:'start'})};"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Limit memory quotes to three lines with expandable text"
          git push
