name: Kitapligim memory section visibility
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore book memory section visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
           ("${b.status==='Okudum'&&(b.mainCharacters||b.setting||b.mainSubject||b.themes||b.favoriteCharacter||b.rating||b.memorySentence)?","${true?"),
           ("${b.memorySentence?`<div class=\"archiveItem archiveWide\"><b>Tek cümleyle hatırladığım</b>${esc(b.memorySentence)}</div>`:''}</div></div>`:''}","${b.memorySentence?`<div class=\"archiveItem archiveWide\"><b>Tek cümleyle hatırladığım</b>${esc(b.memorySentence)}</div>`:''}</div><div class=\"archiveActions\"><button id=\"editBookMemory\" class=\"btn secondary\">${(b.mainCharacters||b.setting||b.mainSubject||b.themes||b.favoriteCharacter||b.rating||b.memorySentence)?'Notlarımı düzenle':'Kitabı Hatırla notlarını ekle'}</button></div></div>`:''}"),
           ("$('#editBook').onclick=()=>renderBookForm(b);","$('#editBook').onclick=()=>renderBookForm(b); const memoryBtn=$('#editBookMemory');if(memoryBtn)memoryBtn.onclick=()=>renderBookForm(b);")
          ]
          for old,new in replacements:
           if old in s:
            assert s.count(old)==1, 'Unexpected duplicate: '+old[:60]
            s=s.replace(old,new)
           elif new not in s:
            raise SystemExit('Expected source missing: '+old[:60])
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit safe change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep Kitabi Hatirla visible on book details"
          git push
