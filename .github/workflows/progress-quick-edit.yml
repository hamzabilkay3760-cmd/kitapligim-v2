name: Kitapligim backup safety audit
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden backup and scan preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const scanPrefsKey='kitapligim_scan_prefs'; let scanPrefs=JSON.parse(localStorage.getItem(scanPrefsKey)||'{"bookId":"","lastPage":""}');"""
          new="""const scanPrefsKey='kitapligim_scan_prefs';
          let scanPrefs={bookId:'',lastPage:''};
          try{
           const rawPrefs=localStorage.getItem(scanPrefsKey);
           if(rawPrefs!==null){
            const parsedPrefs=JSON.parse(rawPrefs);
            if(parsedPrefs&&typeof parsedPrefs==='object'&&!Array.isArray(parsedPrefs))scanPrefs={...scanPrefs,...parsedPrefs};
           }
          }catch(error){
           // An unrelated scan preference must never prevent the book library from opening.
           // Leave the original raw value untouched so it can still be exported.
           console.warn('Kitaplığım: tarama tercihi okunamadı; ham kayıt korunuyor',error);
          }"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});"""
          new="""  const restored=JSON.parse(data.entries[storeKey]);
            if(!validLibrary(restored))throw Error('Kitaplık kaydı doğrulanamadı.');
            const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""a.click();a.remove();localStorage.setItem(backupLastDownloadKey,new Date().toISOString());refreshBackupAssurance();setTimeout(()=>URL.revokeObjectURL(url),60000);"""
          new="""a.click();a.remove();
            try{localStorage.setItem(backupLastDownloadKey,new Date().toISOString());refreshBackupAssurance()}
            catch(error){console.warn('Kitaplığım: yedek tarihi kaydedilemedi',error)}
            setTimeout(()=>URL.revokeObjectURL(url),60000);"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old=""" }catch(err){showBackupStatus('Yedek oluşturulamadı. Tarayıcı depolama alanını kontrol edin.')}"""
          new=""" }catch(err){showBackupStatus('Yedek oluşturulamadı: '+(err.message||'Tarayıcı depolama alanını kontrol edin.')+'. Mevcut kayıtlar değiştirilmedi.')}"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Validate backup exports and protect startup from corrupt scan preferences"
          git push
