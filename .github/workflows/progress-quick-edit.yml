name: Fix Kitapligim journey click
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix journey click and validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=""" const journey=card.querySelector('#readingJourneyOpen');if(journey)journey.onclick=()=>openReadingJourney(year);"""
          new=""" const journey=card.querySelector('#readingJourneyOpen');
           if(journey)journey.addEventListener('click',event=>{
            event.preventDefault();event.stopPropagation();
            try{openReadingJourney(year)}
            catch(error){console.error('Okuma Yolculuğum açılış hatası:',error);alert('Okuma Yolculuğu açılamadı. Lütfen sayfayı yenileyip tekrar dene.')}
           });"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old=""" const quotes=state.quotes.filter(q=>books.some(b=>String(b.id)===String(q.bookId)));"""
          new=""" const quotes=(Array.isArray(state.quotes)?state.quotes:[]).filter(q=>q&&books.some(b=>String(b.id)===String(q.bookId)));"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old=""" const previous=document.getElementById('readingJourneyOverlay');if(previous)previous.remove();"""
          new=""" const previous=document.getElementById('readingJourneyOverlay');if(previous)previous.remove();"""
          assert s.count(old)==1
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.rsplit('<script>',1)[-1].split('</script>',1)[0]
          Path('/tmp/kitapligim-check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/kitapligim-check.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix journey button interaction"
          git push
