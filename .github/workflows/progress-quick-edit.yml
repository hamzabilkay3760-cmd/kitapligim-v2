name: Kitapligim statistics card polish
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish statistics cards without touching data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='#dataView .readingStatsTabs~.eyebrow{margin-top:22px}'
          assert s.count(anchor)==1
          extra="""
          #dataView #readingJournalWeekly,#dataView #monthlyReadingComparison,#dataView #monthlyReadingCalendar,#dataView #annualSummarySafe,#dataView #bookMemoryArchive{border:1px solid #e6dccb;border-radius:22px;box-shadow:0 4px 20px rgba(24,38,64,.045);padding:clamp(15px,3.5vw,22px);overflow:hidden}
          #dataView #readingJournalWeekly .eyebrow,#dataView #monthlyReadingComparison .eyebrow,#dataView #monthlyReadingCalendar .eyebrow,#dataView #annualSummarySafe .eyebrow,#dataView #bookMemoryArchive .eyebrow{letter-spacing:.12em}
          #dataView #readingJournalWeekly .serif,#dataView #monthlyReadingComparison .serif,#dataView #monthlyReadingCalendar .serif,#dataView #annualSummarySafe .serif,#dataView #bookMemoryArchive .serif{letter-spacing:-.025em;line-height:1.15}
          #dataView #readingJournalWeekly .readingHistoryRow{align-items:flex-start!important;gap:10px!important}
          #dataView #readingJournalWeekly .readingHistoryRow>div:first-child{flex:1;min-width:0}
          #dataView #readingJournalWeekly .readingHistoryRow>div:last-child{flex-shrink:0;font-variant-numeric:tabular-nums}
          #dataView #monthlyReadingCalendar .readingCalendarDay{transition:border-color .15s,background-color .15s;min-width:0}
          #dataView #monthlyReadingComparison .card,#dataView #annualSummarySafe .card{box-shadow:none}
          @media(max-width:420px){#dataView #readingJournalWeekly,#dataView #monthlyReadingComparison,#dataView #monthlyReadingCalendar,#dataView #annualSummarySafe,#dataView #bookMemoryArchive{padding:15px;border-radius:19px}#dataView #readingJournalWeekly .serif,#dataView #monthlyReadingComparison .serif,#dataView #monthlyReadingCalendar .serif,#dataView #annualSummarySafe .serif{font-size:clamp(22px,6.2vw,28px)!important}#dataView #readingJournalWeekly .readingHistoryRow{flex-wrap:wrap}}
          """
          s=s.replace(anchor,anchor+'\\n'+extra)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish statistics cards for mobile"
          git push
