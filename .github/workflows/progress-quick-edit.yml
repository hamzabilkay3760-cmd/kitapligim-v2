name: Reading story tap controls
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable tap and hold story controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=""" overlay.querySelector('#journeyClose').onclick=close;
           stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;pause()});
           stage.addEventListener('pointerup',resume);
           stage.addEventListener('pointercancel',resume);
           stage.addEventListener('pointerleave',resume);"""
          new=""" overlay.querySelector('#journeyClose').onclick=close;
           let pressStart=0,pressX=0,pressY=0,pressId=null;
           stage.addEventListener('pointerdown',e=>{
            if(e.target.closest('button')||closed)return;
            pressStart=Date.now();pressX=e.clientX;pressY=e.clientY;pressId=e.pointerId;
            pause();
           });
           stage.addEventListener('pointerup',e=>{
            if(pressId!==e.pointerId)return;
            const isTap=Date.now()-pressStart<320&&Math.hypot(e.clientX-pressX,e.clientY-pressY)<18;
            pressId=null;
            if(!isTap){resume();return}
            holding=false;
            if(e.clientX<stage.getBoundingClientRect().left+stage.getBoundingClientRect().width/2){
             if(index>0){index--;elapsed=0;draw()}else schedule();
            }else{
             if(index===slides.length-1)close();else{index++;elapsed=0;draw()}
            }
           });
           stage.addEventListener('pointercancel',()=>{pressId=null;resume()});
           stage.addEventListener('pointerleave',e=>{if(pressId===e.pointerId){pressId=null;resume()}});"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""<span style="font-size:12px;color:#d7c9b0">Durdurmak için ekrana basılı tut</span>"""
          new="""<span style="font-size:12px;color:#d7c9b0">Sol: geri · Sağ: ileri · Basılı tut: duraklat</span>"""
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/check.js').write_text(s.rsplit('<script>',1)[-1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable tap navigation in auto playing reading stories"
          git push
