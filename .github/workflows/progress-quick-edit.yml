name: Kitapligim reading consistency fix
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix reading totals and current page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const lastPage=lastQuote?.page?String(lastQuote.page):'';"""
          new="""    const lastPage=(b.status||'Okuyorum')==='Okuyorum'&&Number(b.currentPage)>0?String(b.currentPage):'';"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="""function saveReadingStreakData(d){localStorage.setItem(readingStreakKey,JSON.stringify(d))}"""
          new="""function saveReadingStreakData(d){localStorage.setItem(readingStreakKey,JSON.stringify(d))}
          function appendReadingProgress(book,addedPages){
           const n=Number(addedPages);
           if(!Number.isSafeInteger(n)||n<=0)return true;
           const today=localDateKey(),reading=getReadingStreakData(),old=reading.days[today]||{};
           const existing=old.bookPages&&typeof old.bookPages==='object'&&!Array.isArray(old.bookPages)&&Object.keys(old.bookPages).length
            ?old.bookPages:(old.bookId?{[String(old.bookId)]:Math.max(0,Number(old.pages)||0)}:{});
           const bookId=String(book.id);
           const bookPages={...existing,[bookId]:Math.max(0,Number(existing[bookId])||0)+n};
           reading.days[today]={...old,bookId:book.id,bookIds:[...new Set([...(Array.isArray(old.bookIds)?old.bookIds:[]),old.bookId,book.id].filter(Boolean).map(String))],pages:Math.max(0,Number(old.pages)||0)+n,at:Date.now(),bookPages};
           try{saveReadingStreakData(reading);return true}
           catch(error){console.error('Kitaplığım: günlük okuma kaydı kaydedilemedi',error);alert('Günlük okuma sayacı kaydedilemedi. Depolama alanını kontrol et.');return false}
          }"""
          assert s.count(old)==1
          s=s.replace(old,new)
          start=s.index('    if(addedPages){',s.index("$('#bfSave').onclick"))
          end=s.index('    save();',start)
          old=s[start:end]
          new="""    if(addedPages)appendReadingProgress(obj,addedPages);
          """
          s=s[:start]+new+s[end:]
          start=s.index('     const latest=getReadingStreakData();',s.index("dialog.querySelector('#streakSave').onclick"))
          end=s.index('     close();setupReadingStreak();',start)
          old=s[start:end]
          new="""     book.currentPage=String(previous+n);
               appendReadingProgress(book,n);
               save();
          """
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify daily reading increments and fix last read page"
          git push
