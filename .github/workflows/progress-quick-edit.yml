name: Kitapligim guarded mobile back
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard mobile back navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function appGoBack(){
           if(!editGuardBypass&&editGuardDirty()){editGuardDialog(()=>appGoBack());return}
           const prev=navigationStack.pop();"""
          new="""// Keep an in-app browser-history entry for edit forms so mobile back gestures
          // reach the same guarded navigation as the visible Back button.
          let guardedHistorySerial=0;
          function armEditHistory(){
           if(!window.history||!window.history.pushState)return;
           const form=editGuardForm();
           if(!form)return;
           try{
            const marker='kitapligim-edit-'+(++guardedHistorySerial);
            history.pushState({kitapligimEditMarker:marker},'',location.href);
           }catch(err){console.warn('Kitaplığım: mobil geri hareketi bağlanamadı',err)}
          }
          window.addEventListener('popstate',()=>{
           if(!editGuardForm())return;
           // Browser has already moved back one history entry. Restore the in-app
           // sentinel before showing the warning, so Cancel remains on this page.
           armEditHistory();
           appGoBack();
          });
          function appGoBack(){
           if(!editGuardBypass&&editGuardDirty()){editGuardDialog(()=>appGoBack());return}
           const prev=navigationStack.pop();"""
          assert s.count(old)==1
          s=s.replace(old,new)
          # arm after edit form is initialized; don't create duplicate entry when restoring
          old="  editGuardCapture();\n}\n\nfunction askBookFinishedPlace"
          new="  editGuardCapture();\n  if(!navigationRestoring)armEditHistory();\n}\n\nfunction askBookFinishedPlace"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="  editGuardCapture();\n}\nfunction miniEscRegExp"
          new="  editGuardCapture();\n  if(!navigationRestoring)armEditHistory();\n}\nfunction miniEscRegExp"
          assert s.count(old)==1
          s=s.replace(old,new)
          # Fix discard on browser back and regular navigation: a single guard remains in appGoBack
          # Preserve user-approved UI and other data flows.
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route mobile back gestures through unsaved-edit guard"
          git push
