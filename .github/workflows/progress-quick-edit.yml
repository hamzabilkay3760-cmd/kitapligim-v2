name: Kitapligim finish transition check
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status transition detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(book) Object.assign(book,obj); else state.books.push(obj);"
          new="const wasFinished=book?.status==='Okudum';\n    if(book) Object.assign(book,obj); else state.books.push(obj);"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="if((autoFinished||(!book||book.status!=='Okudum')&&status==='Okudum'))showBookFinishedCelebration(obj.id); else renderBook(obj.id);"
          new="if((autoFinished||!wasFinished&&status==='Okudum'))showBookFinishedCelebration(obj.id); else renderBook(obj.id);"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix finished status transition for memory prompts"
          git push
