name: Kitapligim annual goal progress
on:
  push:
    paths:
      - '.github/workflows/progress-quick-edit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show existing annual book goal in yearly statistics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function renderAnnualSummarySafe(){')
          end=s.index('let readingCalendarCursor=',start)
          part=s[start:end]
          old="""   const ids=new Set(books.map(b=>b.id));"""
          new="""   const goalValue=Number(getReadingGoals()[year]);
             const goal=Number.isSafeInteger(goalValue)&&goalValue>0?goalValue:0;
             const goalPercent=goal?Math.min(100,Math.round(books.length/goal*100)):0;
             const goalRemaining=Math.max(0,goal-books.length);
             const goalCard='<section aria-label="Yıllık kitap hedefi" style="margin:12px 0;padding:14px;background:#fbf7ef;border:1px solid #e9dfcd;border-radius:16px">'+
              '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div class="eyebrow" style="font-size:10px">Yıllık kitap hedefim</div>'+
              '<strong style="font-size:13px;color:#182640">'+(goal?books.length+' / '+goal+' kitap':'Hedef belirlenmedi')+'</strong></div>'+
              (goal?'<div role="progressbar" aria-label="Yıllık kitap hedefi ilerlemesi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+goalPercent+'" style="height:9px;border-radius:99px;background:#e6ddce;overflow:hidden;margin:11px 0 8px"><div style="height:100%;width:'+goalPercent+'%;border-radius:99px;background:#a98a4a"></div></div>'+
              '<div class="muted" style="font-size:12px">'+(goalRemaining?'Hedefe '+goalRemaining+' kitap kaldı.':'Tebrikler, yıllık kitap hedefini tamamladın!')+'</div>':
              '<div class="muted" style="font-size:12px;line-height:1.5;margin-top:9px">Kütüphanem ekranındaki yıllık okuma hedefinden kitap sayısı belirleyebilirsin.</div>')+
              '</section>';
             const ids=new Set(books.map(b=>b.id));"""
          assert part.count(old)==1
          part=part.replace(old,new)
          old="""   monthlyChart+
             (books.length"""
          new="""   monthlyChart+goalCard+
             (books.length"""
          assert part.count(old)==1
          part=part.replace(old,new)
          s=s[:start]+part+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show annual book goal progress in yearly statistics"
          git push
